[project]
name = "mundane"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Archana Jagadisan", email = "archana.jagadisan@fourkites.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyswisseph>=2.10.3.2",
    "pytest>=9.2.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.66.1",
    "xlrd>=2.0.2",
    "yfinance>=1.7.0",
]

[project.scripts]
mundane = "mundane:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
